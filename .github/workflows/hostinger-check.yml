name: Revisar o desplegar Ellamara
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Acción en Hostinger
        type: choice
        options: [preview, deploy]
        default: preview
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-check.yml']
permissions:
  contents: read
concurrency:
  group: ellamara-hostinger-production
  cancel-in-progress: false
jobs:
  connection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_KEY_BASE64: ${{ secrets.HOSTINGER_SSH_KEY_BASE64 }}
      SSH_TARGET: ${{ secrets.HOSTINGER_SSH_TARGET }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Obtener el código del commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Comparar archivos y ejecutar el modo elegido
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'preview' }}
        run: |
          : "${SSH_KEY_BASE64:?Falta HOSTINGER_SSH_KEY_BASE64}"
          : "${SSH_TARGET:?Falta HOSTINGER_SSH_TARGET}"
          : "${SSH_KNOWN_HOSTS:?Falta HOSTINGER_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          if ! printf '%s' "$SSH_KEY_BASE64" | base64 --decode > "$ssh_dir/key"; then
            echo '::error::HOSTINGER_SSH_KEY_BASE64 no contiene Base64 válido.'
            exit 1
          fi
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null 2>&1; then
            echo '::error::La clave privada no se puede leer sin frase de paso. Copia el archivo .ready con el comando de PowerShell.'
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          SSH_TARGET=$(printf '%s' "$SSH_TARGET" | sed -z 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [[ ! "$SSH_TARGET" =~ ^[a-zA-Z0-9_]+@[a-zA-Z0-9.-]+$ ]]; then
            echo '::error::HOSTINGER_SSH_TARGET debe contener solo usuario@servidor, sin puerto ni comando ssh.'
            exit 1
          fi
          ssh_options=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -p 65002)
          ssh "${ssh_options[@]}" -- "$SSH_TARGET" \
            'cd ~/domains/ellamarastore.com/public_html && test -f wp-load.php && test -d wp-content/plugins && command -v rsync && echo "WordPress localizado"'
          printf -v ssh_command '%q ' ssh "${ssh_options[@]}"
          components=(
            wp-content/themes/ellamara/ \
            wp-content/plugins/ellamara-cart-controls/ \
            wp-content/plugins/ellamara-catalog/ \
            wp-content/plugins/ellamara-contact/ \
            wp-content/plugins/ellamara-shipping/ \
            wp-content/plugins/ellamara-suggestions/
          )
          destination="$SSH_TARGET:domains/ellamarastore.com/public_html/"
          options=(--recursive --checksum --itemize-changes --relative -e "$ssh_command")
          rsync "${options[@]}" --dry-run --stats "${components[@]}" "$destination"
          if [[ "$MODE" == deploy ]]; then
            ssh "${ssh_options[@]}" -- "$SSH_TARGET" 'set -eu
              umask 077
              cd ~/domains/ellamarastore.com/public_html
              mkdir -p ~/ellamara-deploy-backups
              backup=$(mktemp ~/ellamara-deploy-backups/components.XXXXXXXX.tar.gz)
              tar -czf "$backup" wp-content/themes/ellamara wp-content/plugins/ellamara-cart-controls wp-content/plugins/ellamara-catalog wp-content/plugins/ellamara-contact wp-content/plugins/ellamara-shipping wp-content/plugins/ellamara-suggestions
              tar -tzf "$backup" >/dev/null
              printf "Respaldo creado: %s\n" "${backup##*/}"'
            rsync "${options[@]}" --delay-updates --stats "${components[@]}" "$destination"
          fi
          pending=$(rsync "${options[@]}" --dry-run --out-format='%i %n' "${components[@]}" "$destination")
          if [[ "$MODE" == deploy ]]; then
            if [[ -n "$pending" ]]; then
              printf 'La comprobación posterior detectó diferencias:\n%s\n' "$pending"
              exit 1
            fi
            echo 'Archivos desplegados y verificados por contenido.'
          elif [[ -z "$pending" ]]; then
            echo 'El contenido de los componentes coincide con Hostinger.'
          fi
