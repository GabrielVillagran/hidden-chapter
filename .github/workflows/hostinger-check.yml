name: Probar conexión a Hostinger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hostinger-check.yml']
permissions: {}
jobs:
  connection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SSH_KEY_BASE64: ${{ secrets.HOSTINGER_SSH_KEY_BASE64 }}
      SSH_TARGET: ${{ secrets.HOSTINGER_SSH_TARGET }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
    steps:
      - name: Verificar acceso y ubicación de WordPress
        shell: bash
        run: |
          : "${SSH_KEY_BASE64:?Falta HOSTINGER_SSH_KEY_BASE64}"
          : "${SSH_TARGET:?Falta HOSTINGER_SSH_TARGET}"
          : "${SSH_KNOWN_HOSTS:?Falta HOSTINGER_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          if ! printf '%s' "$SSH_KEY_BASE64" | base64 --decode > "$ssh_dir/key"; then
            echo '::error::HOSTINGER_SSH_KEY_BASE64 no contiene Base64 válido.'
            exit 1
          fi
          if ! ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null 2>&1; then
            echo '::error::La clave privada no se puede leer sin frase de paso. Copia el archivo .ready con el comando de PowerShell.'
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          SSH_TARGET=$(printf '%s' "$SSH_TARGET" | sed -z 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [[ ! "$SSH_TARGET" =~ ^[a-zA-Z0-9_]+@[a-zA-Z0-9.-]+$ ]]; then
            echo '::error::HOSTINGER_SSH_TARGET debe contener solo usuario@servidor, sin puerto ni comando ssh.'
            exit 1
          fi
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -p 65002 -- "$SSH_TARGET" \
            'cd ~/domains/ellamarastore.com/public_html && test -f wp-load.php && test -d wp-content/plugins && command -v rsync && echo "WordPress localizado"'
